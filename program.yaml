    differential_expression: 0.2
    dependency: 0.3
    druggability: 0.25
    safety: 0.15
    tractability_evidence: 0.1
featurizer:
  kind: ecfp_desc
  fp_radius: 2
  fp_bits: 2048
  use_counts: true
  use_chirality: true
  descriptor_set: core
split:
  strategy: scaffold
  test_frac: 0.2
  valid_frac: 0.1
  seed: 1337
  date_column: null
activity_model:
  kind: xgboost
  task: regression
  n_ensemble: 5
  n_estimators: 600
  max_depth: 7
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.6
  min_child_weight: 3.0
  reg_lambda: 1.0
  early_stopping_rounds: 50
  seed: 1337
  n_jobs: -1
admet_model:
  kind: xgboost
  task: regression
  n_ensemble: 5
  n_estimators: 600
  max_depth: 7
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.6
  min_child_weight: 3.0
  reg_lambda: 1.0
  early_stopping_rounds: 50
  seed: 1337
  n_jobs: -1
applicability:
