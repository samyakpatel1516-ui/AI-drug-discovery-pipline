name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest tabulate

      - name: Fast test suite
        # DD_REQUIRE_NETWORK=1 makes the public-benchmark loaders a hard
        # requirement rather than letting them skip. A silently skipped
        # real-data test is how a broken loader survives in a green build.
        env:
          DD_REQUIRE_NETWORK: "1"
        run: pytest -m "not slow" -q

      # The integration test runs the whole pipeline end to end on simulated
      # data (a few minutes). Kept separate so a quick failure is quick to see.
      - name: Integration test
        run: pytest -m slow -q
