[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-pipeline"
version = "0.1.0"
description = "AI-based drug discovery pipeline: target ID, hit discovery, lead optimisation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rdkit>=2023.9",
    "xgboost>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "tabulate>=0.9"]

[project.scripts]
dd-pipeline = "dd_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["dd_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-pipeline integration tests (minutes, not seconds)"]
